<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just in Time - Produção</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand compact"><span class="brand-mark">JIT</span><strong>Just in Time</strong></div>
  <div class="user-area"><strong id="userName">...</strong> <button id="logoutBtn" class="btn small">Sair</button></div>
</header>

<main class="container">
  <div class="breadcrumb"><a href="index.html">← Voltar ao painel</a></div>
  <section class="page-title">
    <div><span class="eyebrow">JUST IN TIME</span><h1>Gestão de Produção</h1><p>Registre entradas de produtos fabricados e saídas por pedidos.</p></div>
  </section>

  <section class="panel">
    <div class="panel-header"><h2>Nova movimentação</h2></div>
    <form id="productionForm" class="form-grid">
      <div>
        <label for="produto">Produto</label>
        <select id="produto" required></select>
      </div>
      <div>
        <label for="tipo">Tipo de movimentação</label>
        <select id="tipo" required>
          <option value="FABRICADO">Fabricado — entrada</option>
          <option value="PEDIDO">Pedido — saída</option>
        </select>
      </div>
      <div><label for="quantidade">Quantidade</label><input id="quantidade" type="number" min="1" step="1" required></div>
      <div><label for="data_movimentacao">Data da movimentação</label><input id="data_movimentacao" type="date" required></div>
      <div class="form-actions"><button type="submit" class="btn primary">Registrar movimentação</button></div>
    </form>
    <p id="productionMessage" class="message"></p>
  </section>

  <section class="panel">
    <div class="panel-header"><h2>Histórico de movimentações</h2></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Data</th><th>Usuário</th></tr></thead>
        <tbody id="productionTable"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/producao.js"></script>
</body>
</html>
