<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just in Time - Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand compact"><span class="brand-mark">JIT</span><strong>Just in Time</strong></div>
  <div class="user-area"><strong id="userName">...</strong> <button id="logoutBtn" class="btn small">Sair</button></div>
</header>

<main class="container">
  <div class="breadcrumb"><a href="index.html">← Voltar ao painel</a></div>
  <section class="page-title">
    <div><span class="eyebrow">ESTOQUE</span><h1>Cadastro de Produtos</h1><p>Gerencie os produtos e seus níveis mínimos de estoque.</p></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Produtos cadastrados</h2>
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Buscar produto...">
        <button id="searchBtn" class="btn">Buscar</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Produto</th><th>Descrição</th><th>Custo</th><th>Estoque</th><th>Mínimo</th><th>Ações</th></tr></thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header"><h2 id="formTitle">Novo produto</h2></div>
    <form id="productForm" class="form-grid">
      <input type="hidden" id="productId">
      <div><label>Nome</label><input id="nome" required maxlength="120"></div>
      <div><label>Descrição</label><input id="descricao" required maxlength="255"></div>
      <div><label>Custo (R$)</label><input id="custo" type="number" step="0.01" min="0" required></div>
      <div><label>Quantidade em estoque</label><input id="quantidade_estoque" type="number" min="0" step="1" required></div>
      <div><label>Estoque mínimo</label><input id="estoque_minimo" type="number" min="0" step="1" required></div>
      <div class="form-actions">
        <button type="submit" class="btn primary">Salvar produto</button>
        <button type="button" id="cancelBtn" class="btn hidden">Cancelar edição</button>
      </div>
    </form>
    <p id="productMessage" class="message"></p>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/produtos.js"></script>
</body>
</html>
